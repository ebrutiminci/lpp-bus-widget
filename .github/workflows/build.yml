name: Build APK

# Runs every time code is pushed to main (or by hand from the Actions tab).
# Builds a signed APK and publishes it as a GitHub Release.
# Fixed download link for phones:
#   https://github.com/<owner>/<repo>/releases/latest/download/lpp-bus.apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. See README → Releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk lpp-bus.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          printf 'Open this page on your phone, tap **lpp-bus.apk**, then Install / Update.\n\nChanges: %s\n' "${COMMIT_MSG:-manual build}" > notes.md
          gh release create "$TAG" lpp-bus.apk \
            --title "LPP Bus ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md \
            --latest
